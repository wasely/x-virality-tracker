[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "x-virality"
version = "0.1.0"
description = "Durable X virality detection and Discord alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pynacl>=1.5,<2",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0.40,<3",
  "structlog>=25,<27",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.10,<5",
  "types-pyyaml>=6.0.12",
]

[project.urls]
Repository = "https://github.com/wasely/x-virality-tracker"
Issues = "https://github.com/wasely/x-virality-tracker/issues"

[project.scripts]
x-virality = "x_virality.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/x_virality"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL",
  "contract: exercises mocked provider HTTP contracts",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["x_virality"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true
