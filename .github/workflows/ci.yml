name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x_virality
          POSTGRES_USER: x_virality
          POSTGRES_PASSWORD: x_virality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U x_virality -d x_virality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      XV_DATABASE_URL: postgresql+psycopg://x_virality:x_virality@127.0.0.1:5432/x_virality
      XV_TEST_DATABASE_URL: postgresql+psycopg://x_virality:x_virality@127.0.0.1:5432/x_virality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - name: Verify migrations from empty database
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest --cov=x_virality --cov-report=term-missing

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose production configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet
      - run: docker build --tag x-virality-ci .
      - name: Verify packaged CLI and runtime modules
        run: |
          docker run --rm x-virality-ci --help
          docker run --rm --entrypoint python x-virality-ci -c "import x_virality.api.app, x_virality.services.rules, x_virality.services.recovery, x_virality.workers.stream, x_virality.workers.jobs"
